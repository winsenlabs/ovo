name: ovo-compact

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ovo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ovo
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-54329}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../packages/plugin-orchestration/migrations/001_durable_orchestration.sql:/docker-entrypoint-initdb.d/010-orchestration.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ovo -d ovo']
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  queue:
    image: softwaremill/elasticmq-native:1.6.15
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - '127.0.0.1:${ELASTICMQ_PORT:-9324}:9324'
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  api:
    image: ${OVO_API_IMAGE:?set OVO_API_IMAGE}
    environment: &common
      OVO_ENVIRONMENT: compact
      DATABASE_URL: postgresql://ovo:${POSTGRES_PASSWORD}@postgres:5432/ovo
      AWS_REGION: ${AWS_REGION:-ap-south-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      OVO_SQS_ENDPOINT: http://queue:9324
      OVO_QUEUE_URL: http://queue:9324/000000000000/ovo-jobs
    depends_on:
      postgres: { condition: service_healthy }
      queue: { condition: service_started }
    ports:
      - '127.0.0.1:${API_PORT:-4000}:4000'
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  console:
    image: ${OVO_CONSOLE_IMAGE:?set OVO_CONSOLE_IMAGE}
    environment:
      API_ORIGIN: http://api:4000
    depends_on:
      api: { condition: service_started }
    ports:
      - '127.0.0.1:${CONSOLE_PORT:-3000}:3000'
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  gateway:
    image: ${OVO_GATEWAY_IMAGE:?set OVO_GATEWAY_IMAGE}
    environment:
      <<: *common
      OVO_WORKER_DISCOVERY: static
      OVO_WORKER_TARGETS: http://worker-1:4100,http://worker-2:4100
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-not-configured}
    depends_on:
      postgres: { condition: service_healthy }
      worker-1: { condition: service_started }
      worker-2: { condition: service_started }
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-4001}:4001'
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped

  dispatcher:
    image: ${OVO_DISPATCHER_IMAGE:?set OVO_DISPATCHER_IMAGE}
    environment:
      <<: *common
      OVO_CAPACITY_AUTHORITY: compact-dispatcher
      OVO_DESIRED_WRITER: compose-static-two-workers
      OVO_INBOUND_WARM_FLOOR: '2'
      OVO_WORKER_MAX_CAPACITY: '2'
      OVO_CARRIER_CONCURRENCY: '2'
      OVO_PROVIDER_CONCURRENCY: '2'
      OVO_AWS_TASK_LIMIT: '2'
      OVO_SPEND_PERMITTED_STARTS: '2'
    depends_on:
      postgres: { condition: service_healthy }
      queue: { condition: service_started }
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped

  worker-1:
    image: ${OVO_WORKER_IMAGE:?set OVO_WORKER_IMAGE}
    environment: &worker
      <<: *common
      OVO_WORKER_ID: compact-worker-1
      OVO_CALL_SLOTS: '1'
      OVO_PROTECTION_MODE: process-lifecycle
      OVO_LIVE_DIAL_ENABLED: 'false'
      OVO_TRANSPORT_CERTIFIED: 'false'
      OVO_MEDIA_READINESS_URL: http://gateway:4001/internal/readiness
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-not-configured}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-not-configured}
    depends_on:
      postgres: { condition: service_healthy }
      queue: { condition: service_started }
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

  worker-2:
    image: ${OVO_WORKER_IMAGE:?set OVO_WORKER_IMAGE}
    environment:
      <<: *worker
      OVO_WORKER_ID: compact-worker-2
    depends_on:
      postgres: { condition: service_healthy }
      queue: { condition: service_started }
    mem_limit: 2g
    cpus: 1.5
    restart: unless-stopped

volumes:
  postgres-data:
